## IDF Component Manager Manifest File
version: "1.3.0"
description: USB Host MSC driver
url: https://github.com/espressif/esp-usb/tree/master/host/class/msc/usb_host_msc
issues: "https://github.com/espressif/esp-usb/issues"
repository: "https://github.com/espressif/esp-usb.git"
repository_info:
  path: "host/class/msc/usb_host_msc"
dependencies:
  idf: ">=5.0"
  # IDF 6.0 took the USB host stack out of the tree and into the
  # registry as espressif/usb. Upstream's manifest says so with the rule
  # below and an override_path into the esp-usb repository; the path is
  # dropped here (it points at nothing in this tree), the rule is kept.
  # On IDF 5.x the rule is false and CMakeLists.txt requires IDF's own
  # `usb`, as before. 6031.
  espressif/usb:
    version: "^1.0.0"
    public: true
    rules:
      - if: "idf_version >=6.0"
targets:
  - esp32s2
  - esp32s3
  - esp32p4
  - esp32h4
  - esp32s31
  - linux
files:
  exclude:
    - "test_app"
    - "host_test"
