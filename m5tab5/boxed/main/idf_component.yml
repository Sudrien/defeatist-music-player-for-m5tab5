# SPDX-License-Identifier: MIT
#
# u-defeatist-0022: the boxed player's manifest. The player's own
# (../../main/idf_component.yml) with every feckless component on
# feckless-libs' umode branch rather than the release tag, as boxwin's and
# Avoidant's and Spurious's umode branches name it while the box is tested,
# and feckless_box_libc, which links into the ELF. This project's
# dependencies.lock records the commit; it is written by the first
# configure, and its diff is read before it is committed (CLAUDE.md).
# The registry pins are the player's, for the reasons its manifest gives:
# esp_audio_codec below 2.6 and esp_hosted below 3.1.
dependencies:
  idf:
    version: ">=6.1"
  espressif/cjson:
    version: "^1.7.19"
  espressif/esp_audio_codec: ">=2.3.0,<2.6.0"
  espressif/esp_hosted: ">=3.0.7,<3.1.0"
  usb_host_msc:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/usb_host_msc
    version: "umode"
  usb_host_uac:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/usb_host_uac
    version: "umode"
  fatfs:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/fatfs
    version: "umode"
  feckless_network_handler:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_network_handler
    version: "umode"
  feckless_storage_handler:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_storage_handler
    version: "umode"
  feckless_drivers:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
