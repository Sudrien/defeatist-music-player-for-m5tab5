dependencies:
  idf:
    version: ">=6.1"

  # cJSON, which IDF 6.0 moved out of the tree and into the registry.
  espressif/cjson:
    version: "^1.7.19"

  # Everything that is not MP3. Ships as precompiled archives under the
  # ESPRESSIF MIT licence -- free, but licensed for use on Espressif
  # silicon only, which is the same caveat the exFAT note carries. P4 has
  # been supported since v2.0.0.
  #
  # AND BELOW 2.6, WHICH REQUIRES ESP32-P4 SILICON REVISION 3.0 -- the
  # precompiled archives stop supporting the earlier die, and the build
  # says so and stops. The Tab5s this has run on are revision v1.3
  # ("chip revision: v1.3" at boot). "^2.3.0" allowed 2.6 the first time
  # dependencies.lock was regenerated; 2.5.0 is what the lock held and
  # what every board run so far has used.
  espressif/esp_audio_codec: ">=2.3.0,<2.6.0"

  # 8097: esp_hosted below 3.1.0, on top of feckless_network_handler's own
  # ">=3.0.2". The lock holds 3.0.10, but a manifest change re-resolves it,
  # and 3.1.0 (2026-11-05) fixes its SDIO RX staging buffers at 1536 bytes
  # for a co-processor that sends no SDIO_MODE TLV -- the Tab5's C6
  # firmware sends none -- and refuses any larger read, while the host
  # still streams and the C6 still batches frames. On a Tab5 (Jinxed
  # Writer, the same C6) every TLS handshake then lost its certificate
  # burst ("SDIO RX read (5120 bytes) exceeds staging target") and no
  # connection opened; 3.0.10 sized the buffer to the read and worked.
  # This keeps the host side where it is, as the lock already has it --
  # it is not an update of either side.
  espressif/esp_hosted: ">=3.0.7,<3.1.0"

  # esp_audio_effects is gone as of 5047: both sample-rate conversions
  # are polyrsp.c now (5039, 5040). Its P4 build below 1.4 measured
  # 223% of real time for 44.1 -> 48 kHz; 1.4 and later need silicon
  # revision 3.0. See ARCHITECTURE.md.

  # 8069: TJpgDec (espressif/esp_jpeg) was named here for the software
  # JPEG fallback. It is feckless_image_handler's now, in its own manifest,
  # at the same "^1.3.1": a re-resolve keeps it.


  # USB mass storage host, for the flash-drive tab in the chooser. The IDF
  # tree carries the host stack itself (the `usb` component); this is the
  # class driver on top of it, and it lives in the registry rather than in
  # IDF.
  #
  # Vendored since 5034, in components/usb_host_msc: 1.3.0 as released
  # (the version dependencies.lock pinned), plus the fixes in 5035 and
  # 6031. 8061: that copy is feckless-libs' usb_host_msc now, unchanged,
  # and components/usb_host_msc is gone. Take it back to the registry
  # when upstream has the fixes.
  usb_host_msc:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/usb_host_msc
    version: "v0.10.1"

  # USB audio host, for the UAC output path. Same story as the MSC driver
  # above: the host stack is in IDF, this is the class driver on top of
  # it. Both sit on the one bus that usbhost.c owns.
  #
  # Vendored since 5025, in components/usb_host_uac: 1.5.0 as released,
  # plus 5026, 5032 and 6062. 8061: that copy is feckless-libs'
  # usb_host_uac now, unchanged, and components/usb_host_uac is gone.
  # Take it back to the registry when upstream has the fixes.
  usb_host_uac:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/usb_host_uac
    version: "v0.10.1"

  # 8061: IDF's FatFs with exFAT, patched at configure time by
  # feckless-libs' fatfs; cmake/exfat.cmake and tools/enable_exfat.sh,
  # which did it here since 6032, are gone.
  fatfs:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/fatfs
    version: "v0.10.1"

  # 6053: Wi-Fi, the saved networks and USB Ethernet are
  # feckless-network-handler-for-m5tab5 now, and the SD card, the USB drive
  # and the storage arbiter are feckless-storage-handler-for-m5tab5. The
  # esp_wifi_remote, esp_hosted, esp_usbh_asix and iot_usbh_ecm entries
  # that were here moved into the first one's manifest, pins and comments
  # unchanged, and arrive through it. Both PINNED TO A TAG, for
  # esp_usbh_asix's reason: a moving branch would change underneath a
  # build that worked.
  #
  # The radio's sdkconfig.defaults lines (the Tab5 preset, reset GPIO 15,
  # init deferred to app_main) stay in this project's file: a component
  # cannot set another's Kconfig.
  # 6060: network v0.2.0 -- each scanned network's BSSID, and a quiet scan.
  # 8060: all four feckless libraries are components of
  # feckless-libs-for-m5tab5 now, named by path: and all at one tag --
  # v0.2.0, which has network v0.2.2 and storage v0.1.0 unchanged,
  # drivers v0.5.10 and graphics v0.2.9. The old repositories are
  # archived; the notes below are what each tag brought, as before.
  # 8061: v0.3.0, whose fatfs, usb_host_msc and usb_host_uac are named
  # above; the four libraries' code is as at v0.2.0.
  feckless_network_handler:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_network_handler
    version: "v0.10.1"
  feckless_storage_handler:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_storage_handler
    version: "v0.10.1"

  # 6054: the USB host, USB audio, HID, the battery monitor, the clock
  # and touch are feckless-drivers-for-m5tab5. The two touch controllers'
  # entries (GT911 for rev 1, ST7123 for rev 2, both because the
  # controller is probed) moved into its manifest and arrive through it.
  # 6056: v0.2.0 adds tab5io (the I2C bus and expanders) and audio_out.
  # 6058: v0.5.0 -- the capture finds the TDM frame's start (0.3.0).
  # v0.5.2: latest drivers tag.
  # 6091: v0.5.3 -- usbhost logs what the host library still holds
  # after each VBUS change, and when every device is freed (its 0012).
  # 6092: v0.5.4 -- hid lets go of a device that left with a claim held
  # (0013), and a custom FIFO split fits both the Synaptics headset's
  # 768-byte isochronous OUT and a drive's 512-byte bulk (0014).
  # 6093: v0.5.5 -- that split inside the hardware's FIFO depth, which
  # v0.5.4 overran (0015).
  # 6094: v0.5.6 -- a refused HID resubmit ends polling, so a dropped
  # headset's remote lets the device go (0016).
  # 6096: v0.5.7 -- the USB converter goes down to 8 kHz, so a device
  # offering only 8 kHz 16-bit is an output (0017).
  # 6098: v0.5.8 -- a USB device's volume is set by the writer between
  # blocks, not by a task that waited behind it all track (0018).
  feckless_drivers:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_drivers
    version: "v0.10.1"

  # 6055: the panel, the backlight and gfx, with the Ark12 and Arabixel
  # fonts, are feckless-graphics-handler-for-m5tab5. esp_lcd_st7121 moved
  # into its manifest, pinned as it was, and arrives through it.
  # 6059: v0.2.0 -- the shadow buffer 128-byte aligned, for the PPA.
  # 6080: v0.2.2 -- Ark12's Number Forms, for 16⅔ and 33⅓ (its 0006).
  # 6100: v0.2.3 -- U+E000, a stacked 3/2, for the Fx sheet (its 0007).
  feckless_graphics_handler:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_graphics_handler
    version: "v0.10.1"

# 8064: feckless-libs v0.4.1 for all of them, which brings
# feckless_nvs_handler (its 4003): settings and saves a key at a time,
# for the feckless ABI's nvs section. The seven other components' code is
# as at v0.3.0 (one comment in wifi.c differs).
  feckless_nvs_handler:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_nvs_handler
    version: "v0.10.1"

# 8069: the pictures. feckless_image_handler (its 7004-7009): the format
# sniff, every decoder this player had (stb_image, pngle, J40, TJpgDec, the
# P4's JPEG engine) behind one img_decode(), the fit, and the favicon.ico
# converter -- albumart.c's, icoimg's and the stbjpeg, jxlimg and pngle
# components', moved. It brings pngle's miniz.h on its public include path
# (its 8002), which i18n.c takes.
  feckless_image_handler:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_image_handler
    version: "v0.10.1"

# minimp3 is NOT here. It is two headers with no component manifest
# upstream, so cmake/vendored.cmake fetches them into components/minimp3/
# at a pinned commit (gitignored, not committed). CC0-1.0. See README.

# 8071: feckless-libs v0.8.1 for all of them (the nine pins above). From
# v0.8: feckless_https_* in the network section and feckless_network_handler
# (8004): the device's own HTTPS certificate and server start, the redirect
# from an IP address to the name, and (8005) the mDNS responder for that
# name, which adds espressif/mdns to feckless_network_handler's manifest. The
# crypto section and 8006 (httpd_resp_send_404 out of the network section;
# v0.8.0 did not link a launcher) ride along. v0.8.1 and not v0.8.0 for that
# last. This player's own code is not changed by this patch.

# 8086: the player becomes an ELF that a launcher (Avoidant, or this
# firmware's own shim) loads through the feckless ABI, and so names the
# core ABI and the sections it takes names from, each at the one tag:
# storage (the card and the drive, libc's file I/O), nvs, network (Wi-Fi,
# sockets, the HTTP server, feckless_https_*), image (the P4's JPEG engine)
# and crypto (a SHA-256, hashing only since feckless-libs' 8007). v0.8.2
# is v0.8.1 plus 8007, and moves every pin above with them; the tag must
# exist before this configures. The ELF itself is the next patch.
  feckless_abi:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_abi
    version: "v0.10.1"
  feckless_abi_storage:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_abi_storage
    version: "v0.10.1"
  feckless_abi_nvs:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_abi_nvs
    version: "v0.10.1"
  feckless_abi_network:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_abi_network
    version: "v0.10.1"
  feckless_abi_image:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_abi_image
    version: "v0.10.1"
  feckless_abi_crypto:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_abi_crypto
    version: "v0.10.1"

# 8092: feckless-libs v0.8.3 for all of them (the fifteen pins above), which
# is v0.8.2 plus its 8008: the audio section. esp_audio_codec's decoders are
# precompiled archives built without -fPIC, so they cannot link into the
# player's ELF (8090's and 8091's aim; the link would stop on R_RISCV_HI20); the
# launcher links the codec and exports its decoders, and the ELF takes
# them from there. feckless_abi_audio pins espressif/esp_audio_codec at
# exactly 2.5.0 -- the app's structures are read by the launcher's codec,
# so the two must agree -- which the range on esp_audio_codec above allows
# and the lock already holds. The build change is the next patch.
  feckless_abi_audio:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_abi_audio
    version: "v0.10.1"

# 8097: feckless-libs v0.9.2 for all sixteen pins. Since v0.8.4, what
# reaches the components named here: IPA glyphs in Ark12 (v0.9.0), and
# feckless_network_handler's feckless_fetch with the network section's
# eight names for it (9003, in v0.9.2) -- the component now requires
# feckless_storage_handler by name, which is named above.
# feckless_keyboard, feckless_mail and feckless_libversions are not used
# here; the player has its own cmake/libversions.cmake.

# 8123: feckless-libs v0.9.10 for all sixteen pins (v0.9.2 -> v0.9.10). What
# reaches the components named here: feckless_fetch's statics in PSRAM when
# CONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY is set, as sdkconfig.defaults
# sets it (9004; the reason 8097 held poddl.c back); the network section's
# redirect handling in feckless_fetch; storage_list.h, one folder's entries
# read in one pass, in the storage section of the ABI (9011); the RX8130's
# alarm calls and tab5io's nCHG_QC_EN ordering (v0.9.10); wifi_stop() without
# a false SDMMC error (v0.9.9); gfx's bold; the nvs handler's per-key calls.
# feckless_chooser, feckless_keyboard, feckless_mail and feckless_camera are
# not used here. The next two patches use feckless_fetch and storage_list.
