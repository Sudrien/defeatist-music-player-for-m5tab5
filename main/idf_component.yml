dependencies:
  idf:
    version: ">=5.4.2"

  # cJSON, which IDF 6.0 moved out of the tree (the `json` component) and
  # into the registry as espressif/cjson. Only from 6.0: on 5.x the rule
  # is false and CMakeLists.txt requires IDF's own `json`. Same headers,
  # same cJSON. 6031.
  espressif/cjson:
    version: "^1.7.19"
    rules:
      - if: "idf_version >=6.0"

  # Everything that is not MP3. Ships as precompiled archives under the
  # ESPRESSIF MIT licence -- free, but licensed for use on Espressif
  # silicon only, which is the same caveat the exFAT note carries. P4 has
  # been supported since v2.0.0.
  #
  # AND BELOW 2.6, WHICH REQUIRES ESP32-P4 SILICON REVISION 3.0 -- the
  # precompiled archives stop supporting the earlier die, and the build
  # says so and stops. The Tab5s this has run on are revision v1.3
  # ("chip revision: v1.3" at boot). "^2.3.0" allowed 2.6 the first time
  # dependencies.lock was regenerated; 2.5.0 is what the lock held and
  # what every board run so far has used.
  espressif/esp_audio_codec: ">=2.3.0,<2.6.0"

  # esp_audio_effects is gone as of 5047: both sample-rate conversions
  # are polyrsp.c now (5039, 5040). Its P4 build below 1.4 measured
  # 223% of real time for 44.1 -> 48 kHz; 1.4 and later need silicon
  # revision 3.0. See ARCHITECTURE.md.

  # TJpgDec, as the software JPEG fallback for covers the hardware
  # decoder cannot allocate for. The P4's decoder has no scaler --
  # jpeg_decode_cfg_t carries a format, a byte order and a colour
  # standard and nothing else -- so a 3000 px cover wants 17.3 MB in one
  # block and does not get it. TJpgDec decodes at 1/2, 1/4 or 1/8.
  #
  # Not in ROM on this chip: the ROM copy exists on ESP32, S3, C3, C6, C5
  # and C61 and the P4 is not among them, so this is about 5 KB of flash.
  # Reached only where the hardware path has already failed.
  #
  # TJpgDec is ChaN's, under its own permissive licence -- the notice has
  # to travel with a redistribution. See README.
  espressif/esp_jpeg: "^1.3.1"

  espressif/esp_lcd_st7121: "^1.0.0"

  # USB mass storage host, for the flash-drive tab in the chooser. The IDF
  # tree carries the host stack itself (the `usb` component); this is the
  # class driver on top of it, and it lives in the registry rather than in
  # IDF.
  #
  # Vendored since 5034, in components/usb_host_msc: 1.3.0 as released
  # (the version dependencies.lock pinned), plus the fixes in 5035. Take
  # this line back when upstream has them.
  # espressif/usb_host_msc: "^1.1.0"

  # USB audio host, for the UAC output path. Same story as the MSC driver
  # above: the host stack is in IDF, this is the class driver on top of
  # it. Both sit on the one bus that usbhost.c owns.
  #
  # Vendored since 5025, in components/usb_host_uac: 1.5.0 as released,
  # plus a descriptor-parser fix the registry does not have yet (5026).
  # The directory's name is the component's name, which is what main's
  # REQUIRES asks for. Take this line back when upstream has the fix.
  # espressif/usb_host_uac: "^1.5.0"

  # 6053: Wi-Fi, the saved networks and USB Ethernet are
  # feckless-network-handler-for-tab5 now, and the SD card, the USB drive
  # and the storage arbiter are feckless-storage-handler-for-tab5. The
  # esp_wifi_remote, esp_hosted, esp_usbh_asix and iot_usbh_ecm entries
  # that were here moved into the first one's manifest, pins and comments
  # unchanged, and arrive through it. Both PINNED TO A TAG, for
  # esp_usbh_asix's reason: a moving branch would change underneath a
  # build that worked.
  #
  # The radio's sdkconfig.defaults lines (the Tab5 preset, reset GPIO 15,
  # init deferred to app_main) stay in this project's file: a component
  # cannot set another's Kconfig.
  feckless_network_handler:
    git: https://github.com/Sudrien/feckless-network-handler-for-tab5.git
    version: "v0.1.0"
  feckless_storage_handler:
    git: https://github.com/Sudrien/feckless-storage-handler-for-tab5.git
    version: "v0.1.0"

  # 6054: the USB host, USB audio, HID, the battery monitor, the clock
  # and touch are feckless-drivers-for-tab5. The two touch controllers'
  # entries (GT911 for rev 1, ST7123 for rev 2, both because the
  # controller is probed) moved into its manifest and arrive through it.
  feckless_drivers:
    git: https://github.com/Sudrien/feckless-drivers-for-tab5.git
    version: "v0.1.0"

# minimp3 is NOT here. It is two headers with no component manifest
# upstream, so it is vendored by tools/fetch_vendored.sh into
# components/minimp3/ and committed. See README.
